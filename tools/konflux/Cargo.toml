[package]
name = "konflux"
version = "0.0.0"
description = "Structural diff and 3-way merge for configs. Flagship (D3, ADR-010)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The kernel head konflux diffs and merges through. Explicit version on the path
# dependency so cargo-deny does not read it as a wildcard requirement.
core-formats = { path = "../../crates/core-formats", version = "0.0.0" }

[dev-dependencies]
# The proof harness runs konflux's golden suites. A dev-dependency, not a
# dependency: core-verify proves things about konflux, so the arrow points that
# way and never back.
core-verify = { path = "../../crates/core-verify", version = "0.0.0" }

[lints]
workspace = true
