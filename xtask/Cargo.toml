[package]
name = "xtask"
version = "0.0.0"
description = "Repo automation: determinism gate, corpus verification, benchmark baselines."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependency policy (MASTER_PLAN §2): minimal and pinned; every new dependency
# needs a one-line justification in the PR.
#
# xtask has ZERO third-party dependencies, deliberately. It is the tool that
# proves determinism and verifies the corpus; it should not itself be a supply
# chain. SHA-256 is implemented in-crate against FIPS 180-4 vectors (ADR-005).
[dependencies]
# First-party only. The "zero dependencies" rule above is about third-party
# supply chain; `corpus-k1` has to call the real parser to prove K1 on the real
# corpus, and calling it through the same `Format` trait every product uses is
# the point.
core-formats = { path = "../crates/core-formats", version = "0.0.0" }
# `conformance-report` renders the published pass rates (§4.1 P4). It shares the
# harness's suite adapters and emitter rather than carrying a second copy: the
# gate byte-compares this command's output, so two renderers would be two
# answers to the same question.
core-verify = { path = "../crates/core-verify", version = "0.0.0" }
# `diff-differential` runs konflux's own diff over the corpus. The differential
# oracle has to call the product, not a copy of it.
konflux = { path = "../tools/konflux", version = "0.0.0" }

[lints]
workspace = true
