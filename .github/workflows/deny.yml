##
## Gate: Supply chain — MASTER_PLAN §8, "cargo-deny (advisories, licenses, bans)".
##
## Policy in deny.toml. Every new dependency also needs a one-line justification
## in the PR (§2) — that part is a human review point, not a robot's.
##
name: deny

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land between our PRs; a weekly sweep catches them.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: gate/supply-chain (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@v7
      # Deliberately not EmbarkStudios/cargo-deny-action: it runs in a musl
      # container that cannot satisfy rust-toolchain.toml, which produces a
      # confusing "toolchain not installed" error next to the real finding.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny --all-features check ${{ matrix.check }}
