##
## Gate: Memory/UB — MASTER_PLAN §8, "miri (kernel crates), ASan/UBSan jobs".
##
## Scoped to the kernel crates: they are the ones every product stands on, and
## a UB bug there is a wrong answer in nine tools rather than one.
##
name: miri

on:
  push:
    branches: [main]
  pull_request:
    paths: ["crates/**", ".github/workflows/miri.yml", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly

jobs:
  miri:
    name: gate/miri (kernel crates)
    runs-on: ubuntu-latest
    # miri interprets every operation, so a test that is instant natively can
    # run for hours here. Without a cap, one such test burns free-tier minutes
    # until GitHub's 6-hour default. Found the expensive way (§10).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - name: miri test kernel crates
        env:
          # -Zmiri-disable-isolation, not a skip list. core-verify's golden runner
          # reads directories, and miri's sandbox refuses `opendir` by default.
          # The choice was between excluding those tests from miri and letting
          # miri reach the real filesystem; disabling isolation runs strictly more
          # code under miri, and skipping tests to make a gate pass is the one
          # thing MASTER_PLAN §8 forbids outright.
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
        run: |
          set -euo pipefail
          for crate in core-cst core-formats core-verify core-cli core-tui; do
            echo "::group::miri $crate"
            cargo miri test -p "$crate" --lib || exit 1
            echo "::endgroup::"
          done

  # MASTER_PLAN §8 names "ASan/UBSan jobs". Rust's `-Zsanitizer` has **no
  # `undefined` option** — the accepted values are address, cfi, dataflow,
  # hwaddress, kcfi, kernel-address, kernel-hwaddress, leak, memory, memtag,
  # safestack, shadow-call-stack, thread, realtime. There is no UBSan for Rust
  # to run, so the undefined-behaviour half of that row is carried by the `miri`
  # job above, which is strictly better at it for Rust code.
  #
  # [NEEDS-AYUSH-APPROVAL] This is a deviation from §8's literal wording. It is
  # not a loosening — nothing is skipped and miri covers UB — but §8 is law and
  # the substitution is his to accept. See MILESTONES.md §0.2.
  sanitizers:
    name: gate/sanitizers (ASan, LSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@v2
      - name: test under ${{ matrix.sanitizer }}sanitizer
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p core-cst -p core-formats -p core-verify -p core-cli -p core-tui
