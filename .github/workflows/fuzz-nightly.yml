##
## Long fuzz (nightly) — MASTER_PLAN §8: "cargo-fuzz, capped for free tier;
## extended runs on Ayush's machine via cron. Report -> new goldens."
##
## This job reports; it does not gate. A finding becomes a golden case and a
## fix, and the golden case is what gates from then on.
##
## Fuzz-hours accumulate toward konflux P1: >=72 cumulative hours with zero
## violations (§4.1). The counter is published as a README badge (§12).
##
name: fuzz-nightly

on:
  schedule:
    # 03:17 UTC — off the hour, so we are not queued behind everyone's cron.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the ledger below reads this workflow's own run history

env:
  CARGO_TERM_COLOR: always

jobs:
  long:
    name: fuzz-long/${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [yaml_roundtrip, json_roundtrip]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\nfuzz -> fuzz/target" }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      - name: Long run (3600s)
        run: |
          set -euo pipefail
          # The working corpus is gitignored scratch (libFuzzer writes into it),
          # so it does not exist on a fresh checkout. The curated seeds beside it
          # are committed evidence.
          mkdir -p fuzz/corpus/${{ matrix.target }}
          # --target is explicit: the installed cargo-fuzz defaults to its own
          # musl host triple, and a sanitizer cannot be linked against a static
          # libc ("sanitizer is incompatible with statically linked libc").
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=3600 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  # --- konflux P1's other half -----------------------------------------------
  # §8 lists the nightly fuzz row as "Report -> new goldens", not blocking, so
  # this reports. P1 itself is a launch gate, and failing every night for the
  # months it takes to accumulate 72 hours would be noise that teaches everyone
  # to ignore this workflow.
  ledger:
    name: fuzz-hours (P1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: long
    if: always()
    steps:
      - uses: actions/checkout@v7
        # Full history: the ledger asks git whether each run's commit descends
        # from the last change to the fuzzed code, and a shallow clone cannot
        # answer that.
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch this workflow's run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow=fuzz-nightly.yml --limit 200 \
            --json databaseId,headSha,conclusion > runs.json
      - name: Fuzz-hours on the CURRENT parser
        continue-on-error: true
        run: cargo run --release -p xtask -- fuzz-hours runs.json
