[package]
name = "core-formats"
version = "0.0.0"
description = "One Format trait, many formats: parse, serialize, semantic view, merge hints."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The kernel crate this one is a head on. Same workspace, explicit version so
# cargo-deny does not read it as a wildcard requirement.
core-cst = { path = "../core-cst", version = "0.0.0" }

[dev-dependencies]
# The proof harness. A dev-dependency, not a dependency: core-verify proves
# things about core-formats, so the arrow points that way and never back.
core-verify = { path = "../core-verify", version = "0.0.0" }

[features]
# Off by default. The conformance suites are FETCHED, not committed
# (conformance/fetch.sh), so this test can only build where they exist. Gating it
# behind a feature is not a skip — `required-features` means the test is not
# compiled at all unless asked for, and the one CI job that asks also fetches.
# The alternative was for six jobs that run `cargo test --workspace` to each
# clone two upstream repositories.
conformance-suites = []

[[test]]
name = "conformance"
required-features = ["conformance-suites"]

[lints]
workspace = true
