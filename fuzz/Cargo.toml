[package]
name = "fuzz"
version = "0.0.0"
description = "cargo-fuzz targets: one per format per operation (MASTER_PLAN §2, §3.3)."
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# Detached from the parent workspace: cargo-fuzz builds on nightly with
# sanitizer and libfuzzer link flags that must not leak into the main build.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# An explicit version, not just a path: cargo-deny reads a bare path
# dependency as a wildcard requirement, and `bans.wildcards = "deny"`
# (correctly) rejects it. Relaxing the ban would have been the wrong fix.
core-cst = { path = "../crates/core-cst", version = "0.0.0" }
core-formats = { path = "../crates/core-formats", version = "0.0.0" }

# One target per format per operation (MASTER_PLAN §2).

[[bin]]
name = "roundtrip_identity"
path = "fuzz_targets/roundtrip_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_roundtrip"
path = "fuzz_targets/yaml_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_roundtrip"
path = "fuzz_targets/json_roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
